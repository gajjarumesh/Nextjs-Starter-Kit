name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: kit_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kit_test
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      CRON_SECRET: ci-cron-secret
      AI_DEFAULT_PROVIDER: mock
      # Public marketing values used by the build and the e2e sales-page checks.
      NEXT_PUBLIC_CONTACT_EMAIL: ci@launchkit.test
      NEXT_PUBLIC_CHECKOUT_SOLO_URL: https://checkout.launchkit.test/solo
      NEXT_PUBLIC_CHECKOUT_TEAM_URL: https://checkout.launchkit.test/team
      NEXT_PUBLIC_CHECKOUT_AGENCY_URL: https://checkout.launchkit.test/agency
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package.json }
      # Works with or without a committed package-lock.json.
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: npm run build
      - run: npm run seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }
