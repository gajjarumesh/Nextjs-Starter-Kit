services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: launchkit
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  app:
    build: .
    profiles: ["app"] # `docker compose --profile app up` to run the app container too
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/launchkit
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
